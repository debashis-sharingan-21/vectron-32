; VECTRON-32 Command Center v2.0
; Production build configuration
; ─────────────────────────────────────────────────────────────
; Target: ESP32-WROOM-32 / ESP32-DevKitC
; Framework: Arduino (ESP-IDF v5 backend via PlatformIO espressif32)
; ─────────────────────────────────────────────────────────────

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino

; ── Serial ──────────────────────────────────────────────────
monitor_speed   = 115200
upload_speed    = 460800
monitor_filters = esp32_exception_decoder, colorize

; ── Filesystem & Partitions ─────────────────────────────────
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv

; ── Library Dependencies ────────────────────────────────────
lib_deps =
    esp32async/AsyncTCP@^3.5.0
    esp32async/ESPAsyncWebServer@^3.7.0

; ── Build Flags ─────────────────────────────────────────────
build_flags =
    -O2
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_USE_WDT=0
    -DARDUINO_LOOP_STACK_SIZE=8192
    -DBOARD_HAS_PSRAM=0

board_build.arduino.ldscript = esp32_out.ld

; ── Debug Environment ────────────────────────────────────────
; Usage: pio run -e esp32dev_debug
[env:esp32dev_debug]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DCORE_DEBUG_LEVEL=4
    -DDEBUG_ESP_PORT=Serial
